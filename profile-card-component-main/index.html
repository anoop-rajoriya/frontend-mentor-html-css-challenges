<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />

    <title>Profile card component</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main>
      <article id="card">
        <figure id="card-img">
          <img
            src="./images/bg-pattern-card.svg"
            alt="Card background pattern image"
          />
        </figure>
        <section id="card-body">
          <figure id="avatar-img">
            <img src="./images/image-victor.jpg" alt="Card avatar image" />
          </figure>
          <h1>Victor Crest <small>26</small></h1>
          <address>London</address>
        </section>
        <section id="card-footer">
          <dl>
            <div>
              <dd>80K</dd>
              <dt>Followers</dt>
            </div>
            <div>
              <dd>803K</dd>
              <dt>Likes</dt>
            </div>
            <div>
              <dd>1.4K</dd>
              <dt>Photos</dt>
            </div>
          </dl>
        </section>
      </article>
    </main>
    <footer>
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
      Coded by <a href="#">Anoop Rajoriya</a>.
    </footer>
  </body>
</html>
