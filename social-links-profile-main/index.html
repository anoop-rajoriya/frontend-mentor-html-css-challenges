<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />

    <title>Frontend Mentor | Social links profile</title>
    <meta
      name="description"
      content="A static social links profile ui component showing the user links."
    />

    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main>
      <article id="card">
        <div id="profile-img"></div>
        <section id="about">
          <h1>Anoop Rajoriya</h1>
          <small>Madhya Pradesh, India</small>
        </section>
        <p id="bio">"Front-end developer and avid reader."</p>
        <nav aria-label="navigation-links">
          <a>GitHub </a>
          <a>Frontend Mentor </a>
          <a>LinkedIn </a>
          <a>Twitter </a>
          <a>Instagram </a>
        </nav>
      </article>
    </main>
    <footer class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
      Coded by <a href="#">Anoop Rajoriya</a>.
    </footer>
  </body>
</html>
