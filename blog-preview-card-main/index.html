<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />

    <title>Blog preview card</title>

    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main>
      <article id="card">
        <figure id="image">
          <img
            src="./assets/images/illustration-article.svg"
            alt="Article illustration image"
          />
        </figure>
        <section id="card-body">
          <span id="badge">Learning</span>
          <time datetime="2023-12-21">Published 21 Dec 2023</time>
          <h1>HTML & CSS foundations</h1>
          <p>
            These languages are the backbone of every website, defining
            structure, content, and presentation.
          </p>
        </section>
        <section id="card-footer">
          <figure id="avatar">
            <img src="./assets/images/avatar-anoop.webp" alt="" />
          </figure>
          <span>Anoop Rajoriya</span>
        </section>
      </article>
    </main>

    <footer class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
      Coded by <a href="#">Anoop Rajoriya</a>.
    </footer>
  </body>
</html>
