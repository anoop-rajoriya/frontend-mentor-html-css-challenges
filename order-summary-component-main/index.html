<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />

    <title>Order summary card</title>

    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="site-main">
      <article class="card">
        <div class="card-img">
          <img src="./images/illustration-hero.svg" alt="Card hero image" />
        </div>
        <div class="card-body">
          <h1>Order Summary</h1>
          <p>
            You can now listen to millions of songs, audiobooks, and podcasts on
            any device anywhere you like!
          </p>
          <div class="plan-card">
            <span class="music-icon"
              ><img src="./images/icon-music.svg" alt="Music icon"
            /></span>
            <div class="plan-details">
              <span>Annual Plan</span>
              <span>$59.99/year</span>
            </div>
            <a class="plan-btn" href="#">Change</a>
          </div>

          <div class="actions">
            <button class="payment-btn">Proceed to Payment</button>
            <button class="cancel-btn">Cancel Order</button>
          </div>
        </div>
      </article>
    </main>

    <footer class="site-footer">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
      Coded by <a href="#">Anoop Rajoriya</a>.
    </footer>
  </body>
</html>
