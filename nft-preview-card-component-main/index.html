<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />

    <title>NFT preview card component</title>

    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="site-main">
      <article class="card">
        <a href="#" class="card-img">
          <img src="./images/image-equilibrium.jpg" alt="Card image" />
          <div class="img-overlay">
            <img src="./images/icon-view.svg" alt="Card image view icon" />
          </div>
        </a>
        <div class="card-body">
          <h1 class="card-title">
            <a href="#">Equilibrium #3429</a>
          </h1>
          <p class="card-desc">
            Our Equilibrium collection promotes balance and calm.
          </p>
          <div class="card-details">
            <div>
              <span class="card-icons">
                <img src="./images/icon-ethereum.svg" alt="ethereum icon" />
              </span>
              0.041 ETH
            </div>
            <div>
              <span class="card-icons">
                <img src="./images/icon-clock.svg" alt="clock icon" />
              </span>
              3 days left
            </div>
          </div>
        </div>
        <footer class="card-footer">
          <span class="avatar-img">
            <img src="./images/image-avatar.png" alt="avatar image" />
          </span>
          <p>Creation of <a href="#" class="avatar-name">Jules Wyvern</a></p>
        </footer>
      </article>
    </main>

    <footer class="site-footer">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
      Coded by <a href="#">Anoop Rajoriya</a>.
    </footer>
  </body>
</html>
